spring.application.name=scholarship-rag-backend
spring.config.import=optional:file:./.env[.properties],optional:file:./scholarship-rag-backend/.env[.properties]

groq.api.key=${GROQ_API_KEY}
groq.model.name=${GROQ_MODEL_NAME}
groq.base.url=${GROQ_BASE_URL}

# Fallback LLM #1: Google Gemini (OpenAI-compatible endpoint). Left blank, the
# provider is skipped and the chain continues to OpenRouter.
gemini.api.key=${GEMINI_API_KEY:}
gemini.model.name=${GEMINI_MODEL_NAME:gemini-2.5-flash}
gemini.base.url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}

# Fallback LLM #2: OpenRouter.
openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.model.name=${OPENROUTER_MODEL_NAME:}
openrouter.base.url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}

# Completion cap for every provider. Providers reject requests whose output
# budget exceeds what the account can pay for (OpenRouter 402), so the cap has
# to be explicit rather than inherited from the model's own maximum.
llm.max-tokens=${LLM_MAX_TOKENS:4096}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
conversation.memory.ttl-hours=${REDIS_TTL_HOURS}

retrieval.top-k=${RETRIEVAL_TOP_K:5}
retrieval.max-distance=${RETRIEVAL_MAX_DISTANCE:1.0}
semantic-memory.max-distance=${SEMANTIC_MEMORY_MAX_DISTANCE:0.30}

chunking.enabled=${CHUNKING_ENABLED:true}
chunking.output=${CHUNKING_OUTPUT:.chunking/chunk-review.txt}
chunking.marker=${CHUNKING_MARKER:.chunking/.corpus-chunked}
chunking.force=${CHUNKING_FORCE:false}

ingest.enabled=${INGEST_ENABLED:false}
ingest.force=${INGEST_FORCE:false}